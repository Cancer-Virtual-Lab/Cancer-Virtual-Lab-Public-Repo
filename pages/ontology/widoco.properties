description=The Cancer Virtual Lab Ontology (CVL-O) is an OWL 2 ontology for representing the oncological care pathway of patients from real-world hospital data: diagnosis and TNM staging, therapies and drug administrations, adverse events, biomarkers, genomic variants, laboratory tests, body measurements, symptom assessments, treatment response and clinical services. It is aligned with HL7 FHIR and reuses standard biomedical terminologies (SNOMED CT, LOINC, NCIt, ICD-10, ATC). CVL-O is the semantic foundation of the Cancer Virtual Lab project, a collaboration between the University of Bologna, IRCCS Istituto Romagnolo per lo Studio dei Tumori (IRST) "Dino Amadori", Aivolution Srl and IFAB (International Foundation Big Data and Artificial Intelligence for Human Development), and underpins the Cancer Virtual Lab knowledge graph.
